name: AnalyzeAll

on: [push]

jobs:
  analyzeall:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Git Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build on linux/amd64
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          push: false
      -
        name: List added files
        run: git diff-tree --no-commit-id --name-only -r ${{ github.sha }}
      - 
        name: build rayhunter-check
        run: |
          sudo docker buildx create --bootstrap --use --name buildkit \
            --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=-1 \
            --driver-opt env.BUILDKIT_STEP_LOG_MAX_SPEED=-1
            sudo docker buildx build -t rayhunter-check:latest --progress plain .
      - 
        name: did we rayhunter-check?
        run: |
          sudo docker images
      -
        name: run rayhunter-check
        run: |
          sudo docker run -v rayhunter-traces:/root/rayhunter-traces rayhunter-check:latest
      -
        name: Upload Documentation to Wiki
        uses: SwiftDocOrg/github-wiki-publish-action@v1
        with:
          path: "pages"
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
